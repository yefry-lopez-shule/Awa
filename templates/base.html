{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Awá{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
        th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
        th { background: #f0f0f0; }
        .block-header td { background: #e6e6e6; font-weight: bold; }
        .warning { color: #a15c00; }
        .errors { background: #fdecea; border: 1px solid #f5c2c0; padding: 0.75rem 1rem; margin-bottom: 1rem; }
        .messages { background: #eaf7ea; border: 1px solid #b9e0b9; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
{% if messages %}
    <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
